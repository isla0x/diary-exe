name: diary_exe
description: "diary.exe — 하루 한 줄, Windows cmd 느낌의 명령어 입력형 일기 앱"
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  home_widget: ">=0.9.0 <0.11.0"
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# 앱 아이콘: `dart run flutter_launcher_icons` 로 iOS / Android 아이콘을 다시 만든다.
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#0C0C0C"
  adaptive_icon_foreground: "assets/icon/icon-foreground.png"

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: NanumGothicCoding
      fonts:
        - asset: assets/fonts/NanumGothicCoding-Regular.ttf
        - asset: assets/fonts/NanumGothicCoding-Bold.ttf
          weight: 700
