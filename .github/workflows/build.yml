name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare platform folders
        run: bash tool/setup_platforms.sh

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Test
        run: flutter test --reporter github

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diary-exe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Google Play 요건 (targetSdk 36 이상)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          T=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdk=$T"
          if [ "${T:-0}" -lt 36 ]; then echo "::error::targetSdk $T < 36 (Google Play 요건)"; exit 1; fi

      - name: Play 업로드 번들 (테스트 키로 서명되는지 확인)
        run: |
          printf 'ci-test-pw\nci-test-pw\n' | bash tool/setup_android_signing.sh
          flutter build appbundle --release
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee /tmp/cert.txt
          grep -q "CN=isla0x" /tmp/cert.txt || { echo "::error::번들이 업로드 키로 서명되지 않았어요"; exit 1; }

      # APK 가 먼저 나오도록 린트는 마지막에 돌린다.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # 위젯 Swift 코드가 컴파일되는지 확인 (Xcode 프로젝트 없이 타입 체크만)
  ios-widget:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Typecheck widget Swift
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          if ! out=$(xcrun swiftc -typecheck -parse-as-library -sdk "$SDK" -target arm64-apple-ios17.0 ios/DiaryWidget/*.swift 2>&1); then
            echo "$out"
            echo "$out" | grep -E "error:" | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "$out"
          echo "widget swift OK"

  # 진짜 iOS 빌드 (서명 없이). Xcode 프로젝트 · 위젯 타깃 · 플러그인이 함께 컴파일되는지 확인한다.
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: App icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
